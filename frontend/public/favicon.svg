<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Bar chart bars (bottom-aligned at y=390) -->
  <!-- Bar 1 (shortest) -->
  <rect x="68" y="300" width="80" height="90" rx="14" fill="url(#bar1)"/>
  <!-- Bar 2 (medium) -->
  <rect x="176" y="220" width="80" height="170" rx="14" fill="url(#bar2)"/>
  <!-- Bar 3 (tall) -->
  <rect x="284" y="150" width="80" height="240" rx="14" fill="url(#bar3)"/>
  <!-- Bar 4 (tallest) -->
  <rect x="392" y="92" width="80" height="298" rx="14" fill="url(#bar4)"/>

  <!-- Baseline -->
  <rect x="52" y="390" width="420" height="12" rx="6" fill="rgba(255,255,255,0.25)"/>

  <!-- Upward trend line -->
  <polyline
    points="108,295  216,215  324,145  432,88"
    stroke="white"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Trend line dots -->
  <circle cx="108" cy="295" r="12" fill="white" opacity="0.95"/>
  <circle cx="216" cy="215" r="12" fill="white" opacity="0.95"/>
  <circle cx="324" cy="145" r="12" fill="white" opacity="0.95"/>
  <circle cx="432" cy="88" r="16" fill="white"/>

  <!-- Arrow head at top-right dot -->
  <polygon points="432,58 450,92 414,92" fill="white"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338ca"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
</svg>